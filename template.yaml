AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-test-localstack
  
  Image Analysis Architecture with LocalStack

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref AnalysisResultsTable
        GEMINI_API_KEY: !Ref GeminiApiKey

Parameters:
  GeminiApiKey:
    Type: String
    Description: "API Key for Google Gemini AI Service"
    NoEcho: true

Resources:
  # 1. Tabla DynamoDB para guardar resultados
  AnalysisResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ImageAnalysisResults
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # 2. Función Lambda de Procesamiento
  ImageAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysisResultsTable
      Events:
        AnalyzeImage:
          Type: Api
          Properties:
            Path: /analyze
            Method: post
            # Configuración para permitir binarios (si se requiriera explícitamente en APIGW REST)
            # En SAM + Lambda Proxy, el body llega en base64 si es binario.

Outputs:
  AnalyzeApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/analyze"
  FunctionArn:
    Description: "Image Analysis Lambda Function ARN"
    Value: !GetAtt ImageAnalysisFunction.Arn
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref AnalysisResultsTable
